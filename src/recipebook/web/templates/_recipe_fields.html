  <label class="wide">Title
    <input name="title" value="{{ form.title }}" required autofocus>
  </label>

  <label class="wide">Headnote <span class="hint">One or two sentences about the dish. Optional.</span>
    <textarea name="headnote" rows="2">{{ form.headnote }}</textarea>
  </label>

  <div class="row">
    <label>Category
      <select name="category">
        {% for name in categories %}<option {{ 'selected' if name == form.category }}>{{ name }}</option>{% endfor %}
      </select>
    </label>
    <label>Tags <span class="hint">Separate with commas</span>
      <input name="tags" value="{{ form.tags }}" placeholder="Fall, Thanksgiving, Make-ahead">
    </label>
  </div>

  <div class="row four">
    <label>Yield
      <select name="yield_label">
        {% for option in ['Serves', 'Makes'] %}<option {{ 'selected' if option == form.yield_label }}>{{ option }}</option>{% endfor %}
      </select>
    </label>
    <label>Amount
      <input name="yield_value" value="{{ form.yield_value }}" placeholder="8, or About 2 cups">
    </label>
    <label>Active time
      <input name="active_time" value="{{ form.active_time }}" placeholder="25 minutes">
    </label>
    <label>Total time
      <input name="total_time" value="{{ form.total_time }}" placeholder="1 hour 45 minutes">
    </label>
  </div>

  <div class="row">
    <label>Ingredients
      <span class="hint">One per line. A line ending in a colon starts a group, like “For the topping:”.</span>
      <textarea name="ingredients" rows="18" required>{{ form.ingredients }}</textarea>
    </label>
    <label>Directions
      <span class="hint">One step per paragraph; leave a blank line between steps. A short phrase before a colon, like “Make the topping:”, prints in bold.</span>
      <textarea name="directions" rows="18" required>{{ form.directions }}</textarea>
    </label>
  </div>

  <label class="wide">Cook’s note <span class="hint">Tips, substitutions, storage. Optional.</span>
    <textarea name="note" rows="2">{{ form.note }}</textarea>
  </label>

  <fieldset>
    <legend>Source</legend>
    <div class="row four">
      <label>Kind
        <select name="source_kind">
          {% for value, text in [('web', 'Website'), ('cookbook', 'Cookbook'), ('other', 'Other')] %}
          <option value="{{ value }}" {{ 'selected' if value == form.source_kind }}>{{ text }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="span3" data-kind="web">Web address
        <input name="source_url" value="{{ form.source_url }}" placeholder="https://…">
      </label>
      <label data-kind="cookbook">Cookbook title
        <input name="source_title" value="{{ form.source_title }}">
      </label>
      <label data-kind="cookbook">Author
        <input name="source_author" value="{{ form.source_author }}">
      </label>
      <label data-kind="cookbook">Page
        <input name="source_page" value="{{ form.source_page }}">
      </label>
      <label class="span3" data-kind="other">Description
        <input name="source_label" value="{{ form.source_label }}" placeholder="Handwritten family recipe card">
      </label>
    </div>
  </fieldset>
